[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects PORT automatically; gunicorn CMD reads it.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Environment variables to set on Railway dashboard:
#   GEMINI_API_KEY        = your Gemini API key
#   GOOGLE_PLACES_API_KEY = your Google Places API key
#   API_KEY               = a random secret (e.g. openssl rand -hex 32)
#                           Must match EXTRACTOR_API_KEY in app/Secrets.xcconfig
